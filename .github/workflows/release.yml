name: Build & Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile AntigravityTokenOrb.exe
        shell: pwsh
        run: |
          ./build.ps1
          Compress-Archive -Path AntigravityTokenOrb.exe, README.md, LICENSE -DestinationPath AntigravityTokenOrb-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityTokenOrb-win-x64
          path: |
            AntigravityTokenOrb.exe
            AntigravityTokenOrb-win-x64.zip

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            AntigravityTokenOrb.exe
            AntigravityTokenOrb-win-x64.zip
